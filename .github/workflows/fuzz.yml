# Every fuzz target for thirty minutes each night, in parallel, off the path
# of any change or release. A target that finds a failing input fails the run,
# which GitHub reports to the repository's owner, and the input is uploaded as
# an artifact: commit it under the package's testdata/fuzz, where every test
# run replays it from then on.
name: fuzz

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzParse
            package: ./internal/decimal
            found: internal/decimal/testdata/fuzz/FuzzParse
          - target: FuzzString
            package: .
            found: testdata/fuzz/FuzzString
          - target: FuzzDeserialize
            package: .
            found: testdata/fuzz/FuzzDeserialize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      # What each night's run found interesting is where the next one starts,
      # so the fuzzing deepens from night to night rather than starting over.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-
      - run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30m ${{ matrix.package }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failing-input-${{ matrix.target }}
          path: ${{ matrix.found }}
