# The GitHub Release of each version tag, made when the tag is pushed, its notes
# the version's section of CHANGELOG.md (make release-notes). A tag is pushed
# by hand, on the release's merge commit, once its pull request has passed the
# gate; the ruleset keeps v* tags from moving. A tag with a pre-release suffix,
# as v1.0.0-rc.1, makes a pre-release. A version the changelog has no section
# for fails the run, and no Release is made.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - name: Notes from CHANGELOG.md
        run: make release-notes VERSION="$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "tenon $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
