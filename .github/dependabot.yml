# Weekly updates for the module's dependencies and for the pinned Actions.
# Dependabot only moves versions the module already depends on; a new
# dependency still needs a decision of its own.
version: 2
updates:
  # ctytenon, which programs import, is a module of its own: its updates
  # reach them. A go-cty update there fails TestOneGoCty until the bench
  # module, whose probes assert go-cty's behavior, and the proof module,
  # which evaluates with go-cty's HCL, move with it.
  - package-ecosystem: gomod
    directories:
      - /
      - /ctytenon
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
