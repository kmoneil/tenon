name: Bug report
description: Something tenon does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        A security problem goes to private reporting, from the repository's
        Security tab, not here.
  - type: input
    id: version
    attributes:
      label: tenon version
      placeholder: v0.6.0
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      description: What `go version` prints.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A short program or input that shows it, and what it printed.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
